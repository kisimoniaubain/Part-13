name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db?sslmode=disable
      JWT_SECRET: test_secret_for_ci
      PORT: 3001
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: npm run start:test > app.log 2>&1 &

      - name: Wait for application
        run: npx --yes wait-on http://localhost:3001 -t 30000

      - name: Run tests
        run: npm test

      - name: Print application logs on failure
        if: failure()
        run: cat app.log
